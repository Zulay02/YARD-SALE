<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="<link rel=" preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Quicksand:wght@300;500;700&display=swap"
          rel="stylesheet">
    <title>Yard Sale | Menú de escritorio</title>
    <style>
         :root {
            --black: #000000;
            --white: #FFFFFF;
            --very-light-pink: #C7C7C7;
            --text-input-field: #f7f7f7;
            --hospital-green: #ACD982;
            --sm: 14px;
            --md: 16px;
            --lg: 18px
        }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            font-family: 'Quicksand', sans-serif;
        }

        .desktop-menu {
            width: 120px;
            height: auto;
            border: 1px solid var(--very-light-pink);
            border-radius: 6px;
            box-shadow: 1px 1px 5px var(--very-light-pink);
            padding: 20px 20px 0 20px;
        }
        .desktop-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .desktop-menu ul li {
            text-align: end;
        }
        .desktop-menu ul li:nth-child(1),
        .desktop-menu ul li:nth-child(2) {
           font-weight: bold;
        }
         .desktop-menu ul li:last-child {
            padding-top: 20px;
            border-top: 1px solid var(--very-light-pink);
         }
         .desktop-menu ul li:last-child a {
            color: var(--hospital-green);
            font-size: var(--sm);
         }
         .desktop-menu ul li a {
            color: var(--black);
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
         }

    </style>
</head>
<body>
    <div class="desktop-menu">
        <ul>
            <li>
              <a href="/" class="title">Mis órdenes</a>  
            </li>

            <li>
                <a href="/">Mi cuenta</a>
            </li>

            <li>
                <a href="/">Cerrar sesión</a>
            </li>
        </ul>
    </div>
</body>
</html>
