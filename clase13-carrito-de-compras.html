<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Quicksand:wght@300;500;700&display=swap"
        rel="stylesheet">
    <title>Yard Sale | Carrito de compras</title>
    <style>
        :root {
            --black: #000000;
            --white: #FFFFFF;
            --very-light-pink: #C7C7C7;
            --text-input-field: #f7f7f7;
            --hospital-green: #ACD982;
            --sm: 14px;
            --md: 16px;
            --lg: 18px
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
        }
        .product-detail {
            width: 360px;
            padding-bottom: 24px;
             box-sizing: border-box;
            position: absolute;
            right: 0;
        }
        .title-container{
            display: flex;
        }
        .title-container img{
            transform: rotate(180deg) ;
            margin: 14px;
        }
        .title {
            font-size: var(--lg);
            font-weight: bold;
        }
         .order {
           display: grid; 
           grid-template-columns: auto 1fr;
           gap: 16px;
           align-items: center;
           background-color: var(--text-input-field);
           margin-bottom: 24px;
           border-radius: 8px;
           padding: 0 24px;
        }
        .order p:nth-child(1) {
            display: flex;
            flex-direction: column; 
        }
        .order p span:nth-child(1) {
            font-size: var(--md);
            font-weight: bold;
        }
         .order p:nth-child(2) {
            text-align: end;
            font-weight: bold; 
        } 
        .shopping-cart {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 16px;
            margin-bottom: 24px;
            align-items: center;
            }
        .shopping-cart figure {
            margin: 0;
            }
        .shopping-cart figure img {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            object-fit: cover;
            }
        .shopping-cart p:nth-child(2) {
            color: var(--very-light-pink);
        }
            .shopping-cart p:nth-child(3) {
            font-size: var(--md);
            font-weight: bold;
        }

        .primary-button {
            background-color: var(--hospital-green);
            border-radius: 8px;
            border: none;
            color: var(--white);
            width: 100%;
            cursor: pointer;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }
        .add-to-cart-button {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 640px) {
            .product-detail {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <aside class="product-detail">
        <div class="title-container">
           <img src="./ASSETS/icons/flechita.svg" alt="Volver">
            <p class="title">Mi orden</p>
        </div>

        <div class="my-order-content">

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/20285553/pexels-photo-20285553.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Audífonos">
                </figure>
                <p>Audífonos</p>
                <p>$250.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/1461048/pexels-photo-1461048.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Tenis blancos">
                </figure>
                <p>Tenis blancos</p>
                <p>$220.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/7842858/pexels-photo-7842858.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Oso de peluche">
                </figure>
                <p>Oso de peluche</p>
                <p>$60.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/815491/pexels-photo-815491.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Peluche de panda">
                </figure>
                <p>Peluche de panda</p>
                <p>$55.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/276517/pexels-photo-276517.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Bicicleta">
                </figure>
                <p>Bicicleta</p>
                <p>$350.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            <div class="shopping-cart">
                <figure>
                    <img src="https://images.pexels.com/photos/9130701/pexels-photo-9130701.jpeg?auto=compress&cs=tinysrgb&w=300"
                        alt="Planta en matera">
                </figure>
                <p>Planta en matera</p>
                <p>$45.000</p>
                <img src="./ASSETS/icons/icon_close.png" alt="Cerrar">
            </div>

            
            <div class="order">
                <p>
                    <span>Total</span>
                </p>
                <p>$980.000</p>
            </div>

            <button class="primary-button">
                Pagar
            </button>
        </div>
    </aside>
</body>

</html>
